[package]
name = "ic-engineer-workbench"
version = "1.0.1"
description = "面向模拟 IC 研发人员的本地 AI 工作台"
authors = ["IC Engineer Workbench Contributors"]
edition = "2021"

[lib]
name = "ic_engineer_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22"
futures-util = "0.3.31"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
lettre = "0.11.23"
lopdf = { version = "0.42", default-features = false }
mail-parser = "0.11.8"
native-tls = "0.2.14"
pdf-extract = "0.12"
printpdf = { version = "0.12.8", default-features = false, features = ["png", "jpeg", "webp"] }
quick-xml = "0.41"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
tokio = { version = "1", features = ["net", "time"] }
tokio-native-tls = "0.3.1"
url = "2"
walkdir = "2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
