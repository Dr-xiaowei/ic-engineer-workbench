name: Windows native validation
on:
  push:
    branches: [feature/windows-validation]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 100
    env:
      PNPM_MANAGE_PACKAGE_MANAGER_VERSIONS: 'false'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/artifacts/windows-validation/cargo
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare scanned locked dependencies and synthetic fixtures
        run: ./app/desktop/scripts/windows-ci-prepare.ps1
      - name: Validate OS reporting guards
        run: node --test app/desktop/scripts/windows-environment.node-test.mjs
      - name: Native frontend, backend, migration, credentials, TLS and conversion regression
        working-directory: app/desktop
        run: node scripts/validate-windows.mjs --scope windows --arch x64 --backup ../../artifacts/windows-validation/ci/fixtures/synthetic-schema9.icwb --tls ../../artifacts/windows-validation/ci/fixtures/tls
      - name: Build separate normal and demo Windows preview installers
        working-directory: app/desktop
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          node scripts/build-windows.mjs --arch x64 --version 1.1.0-rc.1 --webview installed
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/build-windows.mjs --arch x64 --version 1.1.0-rc.2 --webview installed
      - name: Scan preview installers before execution
        run: ./app/desktop/scripts/windows-scan.ps1 -Path artifacts/windows-preview -Log artifacts/windows-validation/ci/installers-scan.json
      - name: Installed native UI, version upgrade and uninstall/reinstall data retention
        run: ./app/desktop/scripts/windows-install-lifecycle.ps1
      - name: Preserve bounded evidence (no TLS private keys or personal databases)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-evidence-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/windows-validation/runs/**/*.log
            artifacts/windows-validation/runs/**/manifest.json
            artifacts/windows-validation/ci/*.json
            artifacts/windows-validation/ui/*.json
            artifacts/windows-validation/ui/*.log
            artifacts/windows-validation/ui/*.png
      - name: Upload unaccepted preview candidates
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-preview-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: artifacts/windows-preview/
